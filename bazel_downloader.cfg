# Stardoc's Maven jars come from Maven Central. Fall back to Google's mirror of it when
# repo1.maven.org fails, so a CDN hiccup doesn't fail the build. Checksums still apply.
rewrite repo1\.maven\.org/maven2/(.*) repo1.maven.org/maven2/$1
rewrite repo1\.maven\.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
