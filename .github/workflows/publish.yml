name: Publish to BCR

# Runs after each release. To retry a failed publish, run it by hand with the tag.
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, like v0.2.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v0.2.2
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: rulescsharp/bazel-central-registry
      # BCR only accepts archive attestations made by the bazel-contrib release_ruleset workflow.
      attest: false
      draft: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
