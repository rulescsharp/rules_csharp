name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Keep Git Bash on Windows from rewriting //labels as paths
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # .bazelversion pins the Bazel that writes the MODULE.bazel.lock files, so fail if one is out of date.
          bazelrc: common --lockfile_mode=error

      - name: Execute all tests
        run: bazel test //...

      - name: Run a Web app from a subpackage
        run: test "$(bazel run //tests/integration/content_root:app | tr -d '\r')" = "from appsettings, from env"

      - name: Run build tools straight from bazel-bin
        # The apphost searches only the dotnet directory next to the app, for every target framework.
        # Without DOTNET_ROOT, the trace shows it used that runtime and the output shows the tool ran.
        run: |
          for tool in gen gen_net8; do
            bazel build //tests/integration/build_tool:$tool
            exe=$(bazel cquery --output=starlark --starlark:expr=target.files_to_run.executable.path "config(//tests/integration/build_tool:$tool, target)" 2>/dev/null | tr -d '\r')
            out="$RUNNER_TEMP/$tool.txt"
            trace=$(env -u DOTNET_ROOT -u DOTNET_ROOT_X64 -u DOTNET_ROOT_ARM64 COREHOST_TRACE=1 "$exe" "$out" 2>&1) || { echo "$trace"; exit 1; }
            echo "$trace" | grep 'Using app-relative location'
            diff tests/integration/build_tool/expected.txt <(tr -d '\r' < "$out")
          done

      - name: Test the Release configuration
        run: bazel test -c opt //tests/integration:compilation_mode_test

      - name: Check compiles outside the compile worker
        # bazel test compiled these in the persistent worker. A fresh server without the action cache compiles them
        # again as a plain process, sandboxed where the OS has a sandbox.
        run: |
          strategy=${{ runner.os == 'Windows' && 'local' || 'sandboxed' }}
          flags="--nouse_action_cache --noremote_accept_cached --strategy=CSharpCompile=$strategy --strategy=CSharpPublicRef=$strategy"
          bazel shutdown
          bazel test //tests/integration/editorconfig:editorconfig_lib //tests/integration/resx:resx_test //tests/integration:ivt_consumer_test $flags 2>&1 | tee plain.log
          if grep -E 'CS2023|Microsoft \(R\)' plain.log; then exit 1; fi
          if bazel build //tests/integration/resx:typed_resx_lib $flags > typed.log 2>&1; then exit 1; fi
          grep "entry 'Logo' is not a string" typed.log

      - name: Check library test filters and results
        run: |
          # Bazel exits with 3 when tests ran and failed, so a build error can't pass for a test failure.
          fails() { local rc=0; "$@" || rc=$?; test "$rc" -eq 3; }
          # The ! reaches VSTest, so the Slow test that always fails stays out.
          bazel test //tests/integration:mstest_sharded --test_filter='TestCategory!=Slow'
          # Escaped characters in a filter reach VSTest as they are.
          bazel test //tests/integration:mstest_sharded --test_filter='FullyQualifiedName=RulesCsharp.IntegrationTests.MSTestSuite.Addition|FullyQualifiedName=Nope\(x\)'
          # A filter that matches nothing fails, sharded or not.
          fails bazel test //tests/integration:mstest_sharded --test_filter=TestCategory=NoSuchCategory
          fails bazel test //tests/integration:mstest_suite --test_filter=TestCategory=NoSuchCategory
          # A failing case shows up in test.xml with its message.
          fails bazel test //tests/integration:mstest_suite --test_filter=TestCategory=Slow
          grep -q '<failure message="Assert.Fail failed. test_filter should leave this out' "$(find "$(bazel info output_path)" -path '*/testlogs/tests/integration/mstest_suite/test.xml' -print -quit)"

      - name: Execute examples tests
        run: cd examples && bazel test //...

      - name: Check examples per-test results
        working-directory: examples
        run: |
          xml=$(find "$(bazel info output_path)" -path '*/testlogs/greeter_mstest/shard_*_of_2/test.xml')
          test "$(echo "$xml" | wc -l)" -eq 2
          cat $xml | grep -o '<testcase name="[^"]*"' | sort | uniq -c
          test "$(cat $xml | grep -o '<testcase name="[^"]*"' | sort -u | wc -l)" -eq 3
          test "$(cat $xml | grep -c '<testcase ')" -eq 3

      - name: Execute proto module tests
        working-directory: proto
        run: bazel test //...

      - name: Run examples binary
        working-directory: examples
        run: |
          test "$(bazel run //:hello | tr -d '\r')" = "$(printf 'Hello, Bazel!\nDebug build. Build with -c opt for Release.\nBuilt for .NET 8 or newer.')"
          test "$(bazel run -c opt //:hello | tr -d '\r')" = "$(printf 'Hello, Bazel!\nRelease build.\nBuilt for .NET 8 or newer.')"

      - name: Run checked_add example
        working-directory: examples
        run: test "$(bazel run //:checked_add | tr -d '\r')" = $'3\noverflow'

      - name: Run examples build tool
        working-directory: examples
        run: |
          test "$(bazel run //:show_version | tr -d '\r')" = "Version 1.2.3"
          # Straight from bazel-bin, with no installed .NET to fall back on.
          bazel build //:make_version
          exe=$(bazel cquery --output=starlark --starlark:expr=target.files_to_run.executable.path 'config(//:make_version, target)' 2>/dev/null | tr -d '\r')
          trace=$(env -u DOTNET_ROOT -u DOTNET_ROOT_X64 -u DOTNET_ROOT_ARM64 COREHOST_TRACE=1 "$exe" 4.5.6 "$RUNNER_TEMP/out.cs" 2>&1) || { echo "$trace"; exit 1; }
          echo "$trace" | grep 'Using app-relative location'
          grep -q '"4.5.6"' "$RUNNER_TEMP/out.cs"

      - name: Run web example
        working-directory: examples
        run: test "$(bazel run //web | tr -d '\r')" = "200 Hello, web!"

      - name: Check examples coverage
        working-directory: examples
        run: |
          bazel coverage //:greeter_test --combined_report=lcov
          awk '/^SF:/ { f = substr($0, 4) }
            f == "Greeter.cs" && /^DA:[0-9]+,[1-9]/ { hit = 1 }
            f == "Greeter.cs" && /^DA:[0-9]+,0$/ { miss = 1 }
            END { exit !(hit && miss) }' bazel-out/_coverage/_coverage_report.dat
          # A library test reports the code it tests too.
          bazel coverage //:greeter_mstest --combined_report=lcov
          awk '/^SF:/ { f = substr($0, 4) }
            f == "Greeter.cs" && /^DA:[0-9]+,[1-9]/ { hit = 1 }
            END { exit !hit }' bazel-out/_coverage/_coverage_report.dat

  bazel-versions:
    name: Examples and proto (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: [7.x, 8.x, 9.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Execute examples tests
        working-directory: examples
        run: bazel test //...

      - name: Execute proto module tests
        working-directory: proto
        run: bazel test //...

  nuget-fetch:
    name: NuGet fetch (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: [7.x, 8.x, 9.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Start bazel-remote with the remote asset API
        run: |
          curl -fsSLo "$RUNNER_TEMP/bazel-remote" \
            https://github.com/buchgr/bazel-remote/releases/download/v2.6.1/bazel-remote-2.6.1-linux-amd64
          echo "025d53aeb03a7fdd4a0e76262a5ae9eeee9f64d53ca510deff1c84cf3f276784  $RUNNER_TEMP/bazel-remote" | sha256sum -c
          chmod +x "$RUNNER_TEMP/bazel-remote"
          "$RUNNER_TEMP/bazel-remote" --dir "$RUNNER_TEMP/bazel-remote-cache" --max_size 1 \
            --experimental_remote_asset_api \
            --grpc_address localhost:9092 --http_address localhost:9091 &
          for _ in $(seq 30); do curl -fs localhost:9091/status >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Fetch packages and an SDK from feeds and mirrors
        run: tests/nuget_fetch/fetch_test.sh grpc://localhost:9092

  release-stamp:
    name: Release version stamp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp a version into both modules
        run: .github/workflows/stamp_version.sh 9.9.9
