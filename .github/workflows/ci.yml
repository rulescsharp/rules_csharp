name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Keep Git Bash on Windows from rewriting //labels as paths
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Execute all tests
        run: bazel test //...

      - name: Execute examples tests
        run: cd examples && bazel test //...

      - name: Check examples per-test results
        working-directory: examples
        run: |
          xml=$(find "$(bazel info output_path)" -path '*/testlogs/greeter_mstest/shard_*_of_2/test.xml')
          test "$(echo "$xml" | wc -l)" -eq 2
          cat $xml | grep -o '<testcase name="[^"]*"' | sort | uniq -c
          test "$(cat $xml | grep -o '<testcase name="[^"]*"' | sort -u | wc -l)" -eq 3
          test "$(cat $xml | grep -c '<testcase ')" -eq 3

      - name: Execute proto module tests
        working-directory: proto
        run: bazel test //...

      - name: Run examples binary
        working-directory: examples
        run: test "$(bazel run //:hello | tr -d '\r')" = "Hello, Bazel!"

      - name: Check examples coverage
        working-directory: examples
        run: |
          bazel coverage //:greeter_test --combined_report=lcov
          awk '/^SF:/ { f = substr($0, 4) }
            f == "Greeter.cs" && /^DA:[0-9]+,[1-9]/ { hit = 1 }
            f == "Greeter.cs" && /^DA:[0-9]+,0$/ { miss = 1 }
            END { exit !(hit && miss) }' bazel-out/_coverage/_coverage_report.dat

  bazel-versions:
    name: Examples and proto (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: [7.x, 8.x, 9.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Execute examples tests
        working-directory: examples
        run: bazel test //...

      - name: Execute proto module tests
        working-directory: proto
        run: bazel test //...

  nuget-fetch:
    name: NuGet fetch (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: [7.x, 8.x, 9.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true

      - name: Start bazel-remote with the remote asset API
        run: |
          curl -fsSLo "$RUNNER_TEMP/bazel-remote" \
            https://github.com/buchgr/bazel-remote/releases/download/v2.6.1/bazel-remote-2.6.1-linux-amd64
          echo "025d53aeb03a7fdd4a0e76262a5ae9eeee9f64d53ca510deff1c84cf3f276784  $RUNNER_TEMP/bazel-remote" | sha256sum -c
          chmod +x "$RUNNER_TEMP/bazel-remote"
          "$RUNNER_TEMP/bazel-remote" --dir "$RUNNER_TEMP/bazel-remote-cache" --max_size 1 \
            --experimental_remote_asset_api \
            --grpc_address localhost:9092 --http_address localhost:9091 &
          for _ in $(seq 30); do curl -fs localhost:9091/status >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Fetch a signed package from packages.lock.json
        run: tests/nuget_fetch/fetch_test.sh grpc://localhost:9092
